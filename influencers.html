<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinSentry — Influencers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/theme.js"></script>
</head>
<body class="min-h-screen">

  <header class="border-b hairline sticky top-0 z-10" style="background: var(--surface-0)">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2 shrink-0">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg" style="background: var(--series-blue)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
        </span>
        <span class="font-semibold text-lg" style="color: var(--text-primary)">FinSentry</span>
      </a>
      <nav class="flex items-center gap-5 text-sm flex-wrap">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="influencers.html" class="nav-link active">Influencers</a>
        <a href="flagged.html" class="nav-link">Flagged Content</a>
      </nav>
      <button id="theme-toggle" class="text-xs border rounded-full px-3 py-1.5 hairline shrink-0" style="color: var(--text-secondary)"></button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6">
      <h1 class="text-2xl font-semibold" style="color: var(--text-primary)">Influencers</h1>
      <p class="text-sm mt-1" style="color: var(--text-secondary)">Your monitored financial-content watchlist.</p>
    </div>

    <!-- Controls -->
    <div class="card p-3 mb-6 flex flex-wrap items-center gap-3">
      <div class="relative flex-1 min-w-[220px]">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search-input" type="text" placeholder="Search by username or name…"
          class="w-full pl-9 pr-3 py-2 rounded-lg text-sm border hairline focus:outline-none"
          style="background: var(--surface-1); color: var(--text-primary)" />
      </div>
      <select id="status-filter" class="text-sm border hairline rounded-lg px-3 py-2" style="background: var(--surface-1); color: var(--text-primary)">
        <option value="all">All statuses</option>
        <option value="active">Active only</option>
        <option value="inactive">Inactive only</option>
      </select>
      <select id="sort-select" class="text-sm border hairline rounded-lg px-3 py-2" style="background: var(--surface-1); color: var(--text-primary)">
        <option value="followers-desc">Sort: Followers (high–low)</option>
        <option value="followers-asc">Sort: Followers (low–high)</option>
        <option value="name-asc">Sort: Name (A–Z)</option>
        <option value="flags-desc">Sort: Most flagged</option>
      </select>
    </div>

    <div id="influencer-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    <p id="empty-state" class="text-sm text-center py-10 hidden" style="color: var(--text-muted)">No influencers match your filters.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/influencers.js"></script>
</body>
</html>
