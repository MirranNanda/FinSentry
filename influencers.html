<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinSentry — Influencers</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/theme.js"></script>
</head>
<body class="min-h-screen">

  <div class="app-shell">
    <aside class="sidebar">
      <a href="index.html" class="sidebar-logo">
        <span class="logo-mark inline-flex items-center justify-center w-8 h-8 rounded-xl shrink-0" style="background: var(--surface-2); border: 1px solid var(--border)">
          <span class="mono-text" style="font-size: 15px">fS</span>
        </span>
        <span class="font-display text-lg" style="color: var(--text-primary); font-weight: 700">Fin<span style="color: var(--text-secondary); font-weight: 600">Sentry</span></span>
      </a>
      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span class="link-label">Dashboard</span>
        </a>
        <a href="influencers.html" class="sidebar-link active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="link-label">Influencers</span>
        </a>
        <a href="flagged.html" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
          <span class="link-label">Flagged Content</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="text-xs border rounded-full px-3 py-1.5 hairline w-full" style="color: var(--text-secondary)"></button>
      </div>
    </aside>

    <main class="app-main">
      <div class="mb-6">
        <h1 class="page-title gradient-text">Influencers</h1>
        <p class="text-sm mt-1" style="color: var(--text-secondary)">Your monitored financial-content watchlist.</p>
      </div>

      <!-- Controls -->
      <div class="card p-3 mb-6 flex flex-wrap items-center gap-3">
        <div class="relative flex-1 min-w-[220px]">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search-input" type="text" placeholder="Search by username or name…"
            class="pill-input w-full pl-9 pr-3 py-2 text-sm border hairline focus:outline-none"
            style="background: var(--surface-1); color: var(--text-primary)" />
        </div>
        <select id="status-filter" class="pill-select text-sm border hairline px-3 py-2" style="background: var(--surface-1); color: var(--text-primary)">
          <option value="all">All statuses</option>
          <option value="active">Active only</option>
          <option value="inactive">Inactive only</option>
        </select>
        <select id="sort-select" class="pill-select text-sm border hairline px-3 py-2" style="background: var(--surface-1); color: var(--text-primary)">
          <option value="followers-desc">Sort: Followers (high–low)</option>
          <option value="followers-asc">Sort: Followers (low–high)</option>
          <option value="name-asc">Sort: Name (A–Z)</option>
          <option value="flags-desc">Sort: Most flagged</option>
        </select>
      </div>

      <div id="influencer-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <p id="empty-state" class="text-sm text-center py-10 hidden" style="color: var(--text-muted)">No influencers match your filters.</p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/influencers.js"></script>
</body>
</html>
