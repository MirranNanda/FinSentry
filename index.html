<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinSentry — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/theme.js"></script>
</head>
<body class="min-h-screen">

  <header class="border-b hairline sticky top-0 z-10 backdrop-blur-md" style="background: var(--surface-0-glass)">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2 shrink-0">
        <span class="logo-mark inline-flex items-center justify-center w-8 h-8 rounded-xl" style="background: linear-gradient(135deg, var(--accent), var(--series-blue))">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
        </span>
        <span class="font-semibold text-lg font-mono-ui" style="color: var(--text-primary)">FinSentry</span>
      </a>
      <nav class="nav-pill-group text-sm">
        <a href="index.html" class="nav-pill active">Dashboard</a>
        <a href="influencers.html" class="nav-pill">Influencers</a>
        <a href="flagged.html" class="nav-pill">Flagged Content</a>
      </nav>
      <button id="theme-toggle" class="text-xs border rounded-full px-3 py-1.5 hairline shrink-0" style="color: var(--text-secondary)"></button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-end justify-between flex-wrap gap-2 mb-6">
      <div>
        <h1 class="page-title text-2xl font-semibold gradient-text">Dashboard</h1>
        <p class="text-sm mt-1" style="color: var(--text-secondary)">Review-priority overview across your influencer watchlist.</p>
      </div>
      <p class="text-xs" style="color: var(--text-muted)">Risk scores are a review priority signal, not a legal determination.</p>
    </div>

    <!-- Stat tiles -->
    <div id="stat-tiles" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></div>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
      <!-- Risk distribution -->
      <section class="card p-5 lg:col-span-2">
        <h2 class="font-semibold mb-4" style="color: var(--text-primary)">Risk level distribution</h2>
        <div id="risk-distribution" class="flex flex-col gap-3"></div>
      </section>

      <!-- Recent flagged reels -->
      <section class="card p-5 lg:col-span-3">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-semibold" style="color: var(--text-primary)">Recently flagged</h2>
          <a href="flagged.html" class="text-sm nav-link">View all →</a>
        </div>
        <div class="overflow-x-auto">
          <table class="data-table w-full text-sm">
            <thead>
              <tr class="text-left">
                <th class="pb-2 pr-3">Influencer</th>
                <th class="pb-2 pr-3">Stock</th>
                <th class="pb-2 pr-3">Call</th>
                <th class="pb-2 pr-3">Risk</th>
                <th class="pb-2 pr-3">Posted</th>
              </tr>
            </thead>
            <tbody id="recent-flags-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
