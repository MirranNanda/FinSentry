<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinSentry — Reel Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/theme.js"></script>
</head>
<body class="min-h-screen">

  <header class="border-b hairline sticky top-0 z-10" style="background: var(--surface-0)">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2 shrink-0">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg" style="background: var(--series-blue)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
        </span>
        <span class="font-semibold text-lg" style="color: var(--text-primary)">FinSentry</span>
      </a>
      <nav class="flex items-center gap-5 text-sm flex-wrap">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="influencers.html" class="nav-link">Influencers</a>
        <a href="flagged.html" class="nav-link active">Flagged Content</a>
      </nav>
      <button id="theme-toggle" class="text-xs border rounded-full px-3 py-1.5 hairline shrink-0" style="color: var(--text-secondary)"></button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <a href="flagged.html" class="text-sm nav-link inline-flex items-center gap-1 mb-4">← Back to flagged content</a>

    <div id="reel-content"></div>
    <div id="not-found" class="hidden text-center py-16">
      <p class="text-lg font-semibold" style="color: var(--text-primary)">Reel not found</p>
      <p class="text-sm mt-1" style="color: var(--text-secondary)">It may have been removed, or the link is invalid.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/reel.js"></script>
</body>
</html>
